# Stack complète locale — SOFIGEPAM Connect
# Usage :
#   docker compose up -d --build
#   API  http://127.0.0.1:8000
#   Web  http://127.0.0.1:3000

name: amanah-fiducie

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sofigepam}
      POSTGRES_USER: ${POSTGRES_USER:-sofigepam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sofigepam}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sofigepam} -d ${POSTGRES_DB:-sofigepam}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    profiles: ["full"]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    profiles: ["full"]

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY:-dev-docker-secret-change-me}
      DEBUG: ${DEBUG:-0}
      USE_SQLITE: "0"
      USE_S3: "0"
      DATABASE_SSL: "0"
      DATABASE_URL: postgres://${POSTGRES_USER:-sofigepam}:${POSTGRES_PASSWORD:-sofigepam}@postgres:5432/${POSTGRES_DB:-sofigepam}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
      SECURE_SSL_REDIRECT: "0"
      LOGIN_OTP_METHOD: ${LOGIN_OTP_METHOD:-email}
      LOGIN_OTP_EXPOSE_DEV_CODE: ${LOGIN_OTP_EXPOSE_DEV_CODE:-1}
      OTP_USE_RESEND: ${OTP_USE_RESEND:-0}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
      PORT: "8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
