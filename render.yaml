# Blueprint Render — SOFIGEPAM Connect API (backend only)
# Front Next.js → Vercel (voir vercel.json)
# Déploiement API : https://dashboard.render.com/blueprint/new?repo=https://github.com/amanahfiducie/AMANAHFIDUCIE

databases:
  - name: amanah-db
    databaseName: sofigepam
    user: sofigepam
    plan: free
    region: frankfurt

services:
  - type: web
    name: amanah-api
    runtime: python
    plan: free
    region: frankfurt
    repo: https://github.com/amanahfiducie/AMANAHFIDUCIE
    branch: main
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: USE_SQLITE
        value: "0"
      - key: USE_S3
        value: "0"
      - key: LOGIN_OTP_METHOD
        value: email
      - key: DATABASE_URL
        fromDatabase:
          name: amanah-db
          property: connectionString
      # URL Vercel du front (ex. https://amanah-fiducie.vercel.app) — sans slash final
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
