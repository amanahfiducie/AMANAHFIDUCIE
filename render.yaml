# Blueprint Render — API Django (Docker) + Postgres
# Front Next.js → Vercel (voir vercel.json / apps/web/Dockerfile pour conteneur local)
# https://dashboard.render.com/blueprint/new?repo=https://github.com/amanahfiducie/AMANAHFIDUCIE

databases:
  - name: amanah-db
    databaseName: sofigepam
    user: sofigepam
    plan: free
    region: frankfurt

services:
  - type: web
    name: amanah-api
    runtime: docker
    plan: free
    region: frankfurt
    repo: https://github.com/amanahfiducie/AMANAHFIDUCIE
    branch: main
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: USE_SQLITE
        value: "0"
      - key: USE_S3
        value: "0"
      - key: DATABASE_SSL
        value: "1"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: LOGIN_OTP_METHOD
        value: email
      # Render free bloque souvent le SMTP sortant — code à l'écran en attendant un provider HTTPS
      - key: LOGIN_OTP_EXPOSE_DEV_CODE
        value: "1"
      - key: OTP_USE_RESEND
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: amanah-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
